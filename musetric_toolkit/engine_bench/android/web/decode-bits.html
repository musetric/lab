<!doctype html><meta charset="utf-8" />
<script type="module">
  import * as MB from '/mediabunny.mjs';
  window.decodeN = async (name, nPackets) => {
    const buf = await (await fetch(`/data/${name}.mp4`)).arrayBuffer();
    const input = new MB.Input({ formats: [MB.MP4], source: new MB.BufferSource(buf) });
    const track = await input.getPrimaryAudioTrack();
    const cfg = await track.getDecoderConfig();
    const sink = new MB.EncodedPacketSink(track);
    const chs = [[], []];
    let err;
    const d = new AudioDecoder({
      output: (a) => {
        for (let c = 0; c < 2; c++) {
          const f = new Float32Array(a.numberOfFrames);
          a.copyTo(f, { planeIndex: c, format: 'f32-planar' });
          chs[c].push(f);
        }
        a.close();
      },
      error: (e) => (err = e),
    });
    d.configure(cfg);
    let n = 0;
    for await (const p of sink.packets()) {
      d.decode(new EncodedAudioChunk({ type: p.type, timestamp: Math.round(p.timestamp * 1e6), data: p.data }));
      if (++n >= nPackets) break;
    }
    await d.flush();
    d.close();
    if (err) throw err;
    const out = chs.map((l) => {
      const t = new Float32Array(l.reduce((s, x) => s + x.length, 0));
      let o = 0;
      for (const x of l) {
        t.set(x, o);
        o += x.length;
      }
      return t;
    });
    const all = new Float32Array(out[0].length * 2);
    all.set(out[0], 0);
    all.set(out[1], out[0].length);
    let s = '';
    const u = new Uint8Array(all.buffer);
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.ready = true;
</script>
