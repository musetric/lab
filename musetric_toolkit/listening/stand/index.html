<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title data-text="pageTitle"></title>
<style>
:root {
  --bg: #2a2a2a; --panel: #1d1d1d; --panel2: #333; --line: #444; --text: #eee; --dim: #a8a8a8;
  --accent: #90caf9; --ok: #81c784; --warn: #ffb74d; --bad: #ef9a9a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #27465e; border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
kbd { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; margin-left: 4px; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
#status { margin-left: auto; color: var(--dim); }
#status.bad { color: var(--bad); }
main { flex: 1; min-height: 0; display: flex; }
#list { width: 112px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 6px; }
#list button { display: flex; width: 100%; gap: 6px; align-items: center; margin-bottom: 3px; padding: 3px 6px; background: transparent; border-color: transparent; text-align: left; }
#list button.current { background: #27465e; border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: none; }
.dot.touched { background: var(--warn); }
.dot.done { background: var(--ok); }
.count { margin-left: auto; color: var(--dim); font-size: 12px; }
#center { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 10px; gap: 8px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#plot { flex: 1; min-height: 300px; position: relative; background: #000; border-radius: 6px; overflow: hidden; }
#plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
#loading[hidden] { display: none; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); color: var(--dim); }
#readout { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 190px; }
label.slider { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
input[type=range] { width: 90px; accent-color: var(--accent); }
#selection { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-height: 92px; }
#selection .hint { color: var(--dim); }
#selinfo { color: var(--dim); font-variant-numeric: tabular-nums; }
.cls { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; }
#intro { color: var(--dim); font-size: 13px; }
#intro b { color: var(--text); }
#cards { display: flex; flex-direction: column; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; display: flex; flex-direction: column; gap: 6px; background: #262626; }
.card.listening { border-color: var(--accent); }
.card.missing { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card h3 small { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 4px; }
.question { color: var(--dim); font-size: 12px; }
.card .row { gap: 4px; }
.card button { padding: 3px 8px; }
.foreign { display: flex; align-items: center; gap: 10px; }
.foreign b { width: 16px; font-weight: 600; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.answers button { padding: 9px 8px; }
.foreign label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.required { color: var(--bad); }
#doneBar { position: sticky; bottom: -10px; background: var(--panel); padding: 6px 0 10px; }
#doneHint { color: var(--bad); font-size: 12px; min-height: 16px; margin-bottom: 3px; }
#plotStem { position: absolute; left: 52px; top: 12px; background: rgba(0,0,0,.72); color: #fff; font-weight: 600; padding: 3px 9px; border-radius: 5px; pointer-events: none; }
#side { width: 380px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 12px; }
#side h2 { font-size: 13px; margin: 0 0 5px; color: var(--dim); font-weight: 600; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
textarea { min-height: 76px; resize: vertical; }
#done { width: 100%; padding: 8px; background: #2c5238; border-color: var(--ok); }
#credit { color: var(--dim); font-size: 12px; }
#credit a { color: var(--accent); }
#private { background: #5a3d12; color: #ffe0b2; border-radius: 5px; padding: 5px 8px; font-size: 12px; }
details { color: var(--dim); font-size: 12px; }
details summary { cursor: pointer; }
details ul { padding-left: 16px; margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title" data-text="pageTitle"></h1>
  <button id="prev" data-title="prevClip">◀<kbd>[</kbd></button>
  <span id="position"></span>
  <button id="next" data-title="nextClip">▶<kbd>]</kbd></button>
  <span id="progress" style="color:var(--dim)"></span>
  <span id="status"></span>
</header>
<main>
  <nav id="list"></nav>
  <section id="center">
    <div class="row" id="stems"></div>
    <div id="plot">
      <canvas id="canvas"></canvas>
      <div id="plotStem"></div>
      <div id="loading" data-text="loading"></div>
    </div>
    <div class="row">
      <button id="play" data-html="play"></button>
      <button id="loop" data-html="loop"></button>
      <button id="slow">0.5×<kbd>G</kbd></button>
      <button id="tool"></button>
      <button id="zoomVoice" data-text="zoomVoice"></button>
      <button id="zoomAll" data-text="zoomAll"></button>
      <label class="slider"><span data-text="volume"></span><input id="volume" type="range" min="0" max="1.5" step="0.01" value="0.9"></label>
      <label class="slider"><span data-text="floor"></span><input id="floor" type="range" min="-85" max="-30" step="1" value="-52"></label>
      <label class="slider"><span data-text="delay"></span><input id="delay" type="range" min="0" max="800" step="5" value="0"><span id="delayValue"></span></label>
      <button id="measure" data-text="measure"></button>
      <span id="readout"></span>
    </div>
    <div id="selection"></div>
  </section>
  <aside id="side">
    <div id="private" hidden></div>
    <div id="intro" data-html="intro"></div>
    <div class="card">
      <h3><span data-text="song"></span> <small data-text="required"></small></h3>
      <div class="question" id="presentAsk" data-text="songAsk"></div>
      <div class="foreign" id="present"></div>
    </div>
    <div id="cards"></div>
    <div>
      <h2 data-text="commentTitle"></h2>
      <textarea id="comment" data-placeholder="commentPlaceholder"></textarea>
    </div>
    <div id="doneBar">
      <div id="doneHint"></div>
      <button id="done" data-html="done"></button>
    </div>
    <div id="credit"></div>
    <details id="hints" data-html="hints"></details>
  </aside>
</main>
<script>
const LOG2 = Math.log2;
const $ = (id) => document.getElementById(id);
const STEM_KEYS = ["KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY", "KeyU"];
const OLD_CONTENT = { none: ["instrumental"], one: ["lead"], lead_backing: ["lead", "backing"] };
const BETTER = ["a", "b", "same", "unknown"];
const STEM_GROUPS = [
  { id: "lead", foreign: ["backing", "instrumental"] },
  { id: "backing", foreign: ["lead", "instrumental"] },
  { id: "instrumental", foreign: ["lead", "backing"] },
];
const VOICE_VIEW = [65.41, 4186];
const PLOT = { left: 44, right: 6, top: 6, bottom: 22 };
const DELAY_KEY = "stand.outputDelay";
const TICK_COUNT = 12;
const TICK_SECONDS = 1;
const TICK_SKIP = 2;
const TICK_MIN_PRESSES = 5;
const TICK_MAX_SPREAD = 0.12;
const MESSAGES_URL = "/messages.ru.json";
let messages = null;

function t(key, values = {}) {
  return messages[key].replace(/\{(\w+)\}/g, (_, name) => values[name]);
}
async function loadMessages() {
  const response = await fetch(MESSAGES_URL);
  messages = await response.json();
  STEM_GROUPS.forEach((group) => Object.assign(group, messages.stemGroups[group.id]));
  document.querySelectorAll("[data-text]").forEach((node) => { node.textContent = messages[node.dataset.text]; });
  document.querySelectorAll("[data-html]").forEach((node) => { node.innerHTML = messages[node.dataset.html]; });
  document.querySelectorAll("[data-title]").forEach((node) => { node.title = messages[node.dataset.title]; });
  document.querySelectorAll("[data-placeholder]").forEach((node) => { node.placeholder = messages[node.dataset.placeholder]; });
  setTool(state.tool);
}

function readDelay() {
  try {
    const text = localStorage.getItem(DELAY_KEY);
    if (text === null) return null;
    const value = Number(text);
    return Number.isFinite(value) && value >= 0 ? value : null;
  } catch (error) {
    return null;
  }
}
function writeDelay(value) {
  try {
    localStorage.setItem(DELAY_KEY, String(value));
    return true;
  } catch (error) {
    return false;
  }
}

const state = {
  manifest: null, labels: {}, index: 0, stem: null, tool: "lasso", loop: false, rate: 1,
  pending: null, selected: null, view: null, floor: -52, position: 0, playing: false,
  boost: null, undo: [], drag: null, hover: null, dirty: true, delay: readDelay(), measure: null, measureNote: "",
};
const audio = { loopRange: [0, 0], ctx: null, master: null, gains: {}, buffers: {}, sources: [], startedAt: 0, startOffset: 0, auditionSource: null, auditionStart: 0, auditionAt: 0, auditionLength: 0, cache: new Map() };
const images = { grey: {}, width: 0, height: 0, canvases: new Map() };

const canvas = $("canvas");
const paint = canvas.getContext("2d");

function clip() { return state.manifest.clips[state.index]; }
function spectrum() { return state.manifest.spectrum; }
function classOf(id) { return state.manifest.classes.find((c) => c.id === id); }
function classesList() { return state.manifest.classes; }

function emptyStem() { return { better: null, foreign: { a: [], b: [] }, comment: "" }; }
function emptyLabel() {
  return { regions: [], present: null, stems: { lead: emptyStem(), backing: emptyStem(), instrumental: emptyStem() }, comment: "", done: false };
}
function presentOf(data) {
  return data.present || OLD_CONTENT[data.content] || [];
}
function asksPresent() {
  return state.manifest.ask === "present";
}
function needsComparison(data) {
  if (asksPresent()) return false;
  if (data.content && !data.present) return true;
  return presentOf(data).length > 1 || Boolean(data.unsure);
}
function missingStems(data) {
  return needsComparison(data) ? STEM_GROUPS.filter((group) => !data.stems[group.id].better) : [];
}
function missingPresent(data) {
  return !presentOf(data).length && !data.unsure;
}
function normalizeLabel(data) {
  if (!data.stems) {
    const stems = emptyLabel().stems;
    stems.lead.better = data.better_lead || null;
    stems.backing.better = data.better_backing || null;
    data.stems = stems;
    delete data.better_lead;
    delete data.better_backing;
  }
  if (data.done && (missingStems(data).length || missingPresent(data))) data.done = false;
  return data;
}
function label() {
  const id = clip().id;
  if (!state.labels[id]) state.labels[id] = emptyLabel();
  return state.labels[id];
}

function ensureAudio() {
  if (!audio.ctx) {
    audio.ctx = new AudioContext();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = Number($("volume").value);
    audio.master.connect(audio.ctx.destination);
  }
  if (audio.ctx.state === "suspended") audio.ctx.resume();
  renderDelay();
}

function formatTime(seconds) {
  const whole = Math.floor(seconds / 60);
  const rest = seconds - whole * 60;
  return `${whole}:${rest.toFixed(2).padStart(5, "0")}`;
}
function noteName(hz) {
  const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const midi = Math.round(69 + 12 * LOG2(hz / 440));
  return `${names[(midi % 12 + 12) % 12]}${Math.floor(midi / 12) - 1}`;
}

function setStatus(text, bad) {
  $("status").textContent = text;
  $("status").className = bad ? "bad" : "";
}

const saveTimers = new Map();
function touch() {
  renderList();
  const id = clip().id;
  clearTimeout(saveTimers.get(id));
  setStatus(t("saving"));
  saveTimers.set(id, setTimeout(() => save(id), 250));
}
window.addEventListener("pagehide", () => {
  saveTimers.forEach((timer, id) => {
    clearTimeout(timer);
    navigator.sendBeacon("/api/save", JSON.stringify({ clip: id, data: state.labels[id] }));
  });
  saveTimers.clear();
});
async function save(id) {
  saveTimers.delete(id);
  try {
    const response = await fetch("/api/save", { method: "POST", body: JSON.stringify({ clip: id, data: state.labels[id] }) });
    if (!response.ok) throw new Error(await response.text());
    setStatus(t("saved", { time: new Date().toLocaleTimeString() }));
  } catch (error) {
    setStatus(t("notSaved", { error: error.message }), true);
  }
}
function remember() {
  state.undo.push({ clip: clip().id, data: JSON.stringify(label()) });
  if (state.undo.length > 100) state.undo.shift();
}
function undo() {
  const entry = state.undo.pop();
  if (!entry) return;
  state.labels[entry.clip] = JSON.parse(entry.data);
  const index = state.manifest.clips.findIndex((c) => c.id === entry.clip);
  state.selected = null; state.pending = null;
  if (index !== state.index) loadClip(index); else renderAll();
  touch();
}

function renderList() {
  const list = $("list");
  const scrolled = list.scrollTop;
  list.innerHTML = "";
  let done = 0;
  state.manifest.clips.forEach((item, i) => {
    const data = state.labels[item.id];
    const answered = data && STEM_GROUPS.some((group) => {
      const stem = data.stems[group.id];
      return stem.better || stem.comment || stem.foreign.a.length || stem.foreign.b.length;
    });
    const touched = data && (data.regions.length || presentOf(data).length || data.unsure || data.comment || answered);
    if (data && data.done) done += 1;
    const row = document.createElement("button");
    row.className = i === state.index ? "current" : "";
    const dot = document.createElement("span");
    dot.className = `dot ${data && data.done ? "done" : touched ? "touched" : ""}`;
    row.append(dot, document.createTextNode(`${i + 1}${item.train === false ? " 🔒" : ""}`));
    if (data && data.regions.length) {
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = data.regions.length;
      row.append(count);
    }
    row.onclick = () => loadClip(i);
    list.append(row);
  });
  list.scrollTop = scrolled;
  if (list.children[state.index]) list.children[state.index].scrollIntoView({ block: "nearest" });
  $("position").textContent = t("clipPosition", { index: state.index + 1, total: state.manifest.clips.length });
  $("progress").textContent = t("progress", { done });
}

function renderStems() {
  const host = $("stems");
  host.innerHTML = "";
  const current = state.manifest.stems.find((stem) => stem.id === state.stem);
  $("plotStem").textContent = current ? current.title : "";
  state.manifest.stems.forEach((stem, i) => {
    const button = document.createElement("button");
    button.className = stem.id === state.stem ? "on" : "";
    button.innerHTML = `${stem.title}<kbd>${STEM_KEYS[i].slice(3)}</kbd>`;
    button.onclick = () => setStem(stem.id);
    host.append(button);
  });
}

function togglePresent(id) {
  remember();
  const data = label();
  const ticked = presentOf(data);
  data.present = ticked.includes(id) ? ticked.filter((v) => v !== id) : [...ticked, id];
  data.unsure = false;
  renderForm();
  touch();
}
function toggleUnsure() {
  remember();
  const data = label();
  data.unsure = !data.unsure;
  if (data.unsure) data.present = [];
  renderForm();
  touch();
}
function renderAnswers(data) {
  const host = $("present");
  host.innerHTML = "";
  host.className = "answers";
  STEM_GROUPS.forEach((group, i) => {
    const button = document.createElement("button");
    button.dataset.present = group.id;
    button.className = presentOf(data).includes(group.id) ? "on" : "";
    button.innerHTML = `${t("hasStem", { stem: group.title.toLowerCase() })}<kbd>${i + 1}</kbd>`;
    button.onclick = () => togglePresent(group.id);
    host.append(button);
  });
  const unsure = document.createElement("button");
  unsure.dataset.unsure = "1";
  unsure.className = data.unsure ? "on" : "";
  unsure.innerHTML = `${messages.better.unknown}<kbd>${STEM_GROUPS.length + 1}</kbd>`;
  unsure.onclick = toggleUnsure;
  host.append(unsure);
  $("doneHint").textContent = state.showMissing && missingPresent(data) ? t("markOrUnsure") : "";
}
function renderPresent(data) {
  if (asksPresent()) { renderAnswers(data); return; }
  const host = $("present");
  host.innerHTML = "";
  STEM_GROUPS.forEach((group) => {
    const item = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.dataset.present = group.id;
    box.checked = presentOf(data).includes(group.id);
    box.onchange = () => {
      remember();
      const ticked = presentOf(data);
      data.present = box.checked ? [...ticked, group.id] : ticked.filter((v) => v !== group.id);
      data.unsure = false;
      host.querySelector("[data-unsure]").checked = false;
      renderCards(data);
      renderList();
      touch();
    };
    item.append(box, document.createTextNode(t("hasStem", { stem: group.title.toLowerCase() })));
    host.append(item);
  });
  const item = document.createElement("label");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.dataset.unsure = "1";
  box.checked = Boolean(data.unsure);
  box.onchange = () => {
    remember();
    data.unsure = box.checked;
    if (box.checked) data.present = [];
    renderPresent(data);
    renderCards(data);
    renderList();
    touch();
  };
  item.append(box, document.createTextNode(messages.better.unknown));
  host.append(item);
}

function stemKey(stemId) {
  const index = state.manifest.stems.findIndex((stem) => stem.id === stemId);
  return index >= 0 ? STEM_KEYS[index].slice(3) : "";
}
function renderCards(data) {
  const host = $("cards");
  host.innerHTML = "";
  if (asksPresent()) return;
  if (!needsComparison(data)) {
    $("doneHint").textContent = missingPresent(data) ? t("markOrUnsure") : t("idealKnown");
    return;
  }
  const missing = missingStems(data);
  STEM_GROUPS.forEach((group) => {
    const stem = data.stems[group.id];
    const card = document.createElement("div");
    const listening = state.stem && state.stem.startsWith(`${group.id}_`);
    const flagged = state.showMissing && missing.includes(group);
    card.className = `card${listening ? " listening" : ""}${flagged ? " missing" : ""}`;
    card.dataset.stem = group.id;

    const title = document.createElement("h3");
    title.innerHTML = `${group.title} <small>${group.hint}</small>`;
    card.append(title);

    const listen = document.createElement("div");
    listen.className = "row";
    const listenLabel = document.createElement("span");
    listenLabel.className = "question";
    listenLabel.textContent = t("listen");
    listen.append(listenLabel);
    ["a", "b"].forEach((side) => {
      const id = `${group.id}_${side}`;
      const button = document.createElement("button");
      button.dataset.listen = side;
      button.className = state.stem === id ? "on" : "";
      button.innerHTML = `${group.title} ${side.toUpperCase()}<kbd>${stemKey(id)}</kbd>`;
      button.onclick = () => setStem(id);
      listen.append(button);
    });
    card.append(listen);

    const ask = document.createElement("div");
    ask.className = "question";
    ask.innerHTML = `${t("whichCleaner", { stem: group.title.toLowerCase() })} <span class="required">${t("required")}</span>`;
    card.append(ask);
    const choices = document.createElement("div");
    choices.className = "row";
    BETTER.forEach((id) => {
      const button = document.createElement("button");
      button.dataset.better = id;
      button.textContent = messages.better[id];
      button.className = stem.better === id ? "on" : "";
      button.onclick = () => {
        remember();
        stem.better = stem.better === id ? null : id;
        renderForm();
        touch();
      };
      choices.append(button);
    });
    card.append(choices);

    const heard = document.createElement("div");
    heard.className = "question";
    heard.textContent = t("heardForeign", { where: group.where });
    card.append(heard);
    ["a", "b"].forEach((side) => {
      const row = document.createElement("div");
      row.className = "foreign";
      const name = document.createElement("b");
      name.textContent = side.toUpperCase();
      row.append(name);
      group.foreign.forEach((id) => {
        const item = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.dataset.side = side;
        box.dataset.foreign = id;
        box.checked = stem.foreign[side].includes(id);
        box.onchange = () => {
          remember();
          stem.foreign[side] = box.checked ? [...stem.foreign[side], id] : stem.foreign[side].filter((v) => v !== id);
          renderList();
          touch();
        };
        item.append(box, document.createTextNode(messages.foreignNames[id]));
        row.append(item);
      });
      card.append(row);
    });

    const note = document.createElement("input");
    note.type = "text";
    note.dataset.comment = "1";
    note.placeholder = t("stemComment", { stem: group.title });
    note.value = stem.comment || "";
    note.oninput = () => { stem.comment = note.value; touch(); };
    card.append(note);
    host.append(card);
  });
  const titles = missing.map((group) => group.title.toLowerCase()).join(", ");
  $("doneHint").textContent = missing.length ? t("leftToCompare", { stems: titles }) : "";
}

function renderForm() {
  const data = label();
  renderPresent(data);
  renderCards(data);
  if (document.activeElement !== $("comment")) $("comment").value = data.comment || "";
  const item = clip();
  const credit = item.credit || {};
  const privateNote = $("private");
  privateNote.hidden = item.train !== false;
  privateNote.textContent = item.note || "";
  const license = credit.license_url ? `<a href="${credit.license_url}" target="_blank" rel="noreferrer">${credit.license}</a>` : (credit.license || "");

  pause();
  const buffer = clickBuffer();
  const first = audio.ctx.currentTime + 0.6;
  const sources = [];
  for (let i = 0; i < TICK_COUNT + TICK_SKIP; i += 1) {
    const source = audio.ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(audio.master);
    source.start(first + i * TICK_SECONDS);
    sources.push(source);
  }
  state.measureNote = "";
  state.measure = {
    first, presses: [], sources,
    timer: setTimeout(finishMeasure, ((TICK_COUNT + TICK_SKIP) * TICK_SECONDS + 1.8) * 1000),
  };
  state.pending = null; state.selected = null;
  renderSelection();
}
function cancelMeasure() {
  const run = state.measure;
  if (!run) return;
  clearTimeout(run.timer);
  run.sources.forEach(stopSource);
  state.measure = null;
}
function pressMeasure(event) {
  const run = state.measure;
  const age = Math.max(0, (performance.now() - event.timeStamp) / 1000);
  run.presses.push(audio.ctx.currentTime - age);
  if (run.presses.length >= TICK_COUNT + TICK_SKIP) finishMeasure(); else renderSelection();
}
function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)];
}
function finishMeasure() {
  const run = state.measure;
  if (!run) return;
  cancelMeasure();
  const phases = run.presses.slice(TICK_SKIP).map((press) => {
    const phase = ((press - run.first) % TICK_SECONDS + TICK_SECONDS) % TICK_SECONDS;
    return phase > 0.9 * TICK_SECONDS ? phase - TICK_SECONDS : phase;
  });
  if (phases.length < TICK_MIN_PRESSES) {
    state.measureNote = t("tooFewPresses");
  } else {
    const middle = median(phases);
    const spread = median(phases.map((p) => Math.abs(p - middle)));
    if (spread > TICK_MAX_SPREAD) {
      state.measureNote = t("unevenPresses", { spread: Math.round(spread * 1000) });
    } else {
      setDelay(Math.max(0, middle));
      state.measureNote = t("measuredDelay", { delay: Math.round(outputDelay() * 1000), spread: Math.round(spread * 1000) });
    }
  }
  renderSelection();
}

function togglePlay() {
  ensureAudio();
  connectGains();
  if (state.playing || audio.auditionSource) pause(); else play(state.position);
}
function nextClip(direction) {
  const count = state.manifest.clips.length;
  const target = state.index + direction;
  if (target >= 0 && target < count) loadClip(target);
}
function finishClip() {
  if (missingPresent(label())) {
    state.showMissing = true;
    renderForm();
    setStatus(t("markOrUnsure"), true);
    return;
  }
  const missing = missingStems(label());
  if (missing.length) {
    state.showMissing = true;
    renderForm();
    setStatus(t("leftToCompare", { stems: missing.map((group) => group.title.toLowerCase()).join(", ") }), true);
    const card = document.querySelector(`.card[data-stem="${missing[0].id}"]`);
    if (card) card.scrollIntoView({ block: "center" });
    return;
  }
  remember();
  label().done = true;
  touch();
  const clips = state.manifest.clips;
  for (let step = 1; step <= clips.length; step += 1) {
    const i = (state.index + step) % clips.length;
    const data = state.labels[clips[i].id];
    if (!data || !data.done) { loadClip(i, asksPresent()); return; }
  }
  setStatus(t("allDone"));
  renderAll();
}
function restartIfPlaying() {
  if (state.playing) play(currentPosition());
}

$("play").onclick = togglePlay;
$("loop").onclick = () => { state.loop = !state.loop; $("loop").className = state.loop ? "on" : ""; restartIfPlaying(); };
$("slow").onclick = () => { state.rate = state.rate === 1 ? 0.5 : 1; $("slow").className = state.rate !== 1 ? "on" : ""; restartIfPlaying(); };
function setTool(tool) {
  state.tool = tool;
  $("tool").innerHTML = `${t(tool === "box" ? "toolBox" : "toolLasso")}<kbd>F</kbd>`;
}
$("tool").onclick = () => setTool(state.tool === "box" ? "lasso" : "box");
$("zoomVoice").onclick = () => resetView();
$("zoomAll").onclick = () => resetView([spectrum().fmin, spectrum().fmin * 2 ** spectrum().octaves]);
$("volume").oninput = () => { if (audio.master) audio.master.gain.value = Number($("volume").value); };
$("floor").oninput = () => { state.floor = Number($("floor").value); images.canvases.clear(); state.dirty = true; };
$("delay").oninput = () => setDelay(Number($("delay").value) / 1000);
$("measure").onclick = () => { $("measure").blur(); startMeasure(); };
$("prev").onclick = () => nextClip(-1);
$("next").onclick = () => nextClip(1);
$("done").onclick = finishClip;
$("comment").oninput = () => { label().comment = $("comment").value; touch(); };

window.addEventListener("keydown", (event) => {
  if (state.measure) {
    event.preventDefault();
    if (event.code === "Escape") { cancelMeasure(); renderSelection(); }
    if (event.code === "Space" && !event.repeat) pressMeasure(event);
    return;
  }
  const field = document.activeElement;
  const typing = field && (field.tagName === "TEXTAREA" || field.tagName === "INPUT") && field.type !== "range" && field.type !== "checkbox";
  if (event.ctrlKey && event.code === "KeyZ" && !typing) { event.preventDefault(); undo(); return; }
  if (typing) {
    if (event.code === "Escape") field.blur();
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const stemIndex = STEM_KEYS.indexOf(event.code);
  if (stemIndex >= 0 && state.manifest.stems[stemIndex]) { setStem(state.manifest.stems[stemIndex].id); return; }
  if (event.code.startsWith("Digit") && asksPresent()) {
    const digit = Number(event.code.slice(5));
    if (digit === STEM_GROUPS.length + 1) toggleUnsure();
    else if (STEM_GROUPS[digit - 1]) togglePresent(STEM_GROUPS[digit - 1].id);
    return;
  }
  if (event.code.startsWith("Digit")) {
    const item = classesList()[Number(event.code.slice(5)) - 1];
    if (item && activeRegion()) assignClass(item.id);
    return;
  }
  switch (event.code) {
    case "Space": event.preventDefault(); if (field && field.blur) field.blur(); togglePlay(); break;
    case "KeyS": if (!asksPresent()) audition("only"); break;
    case "KeyD": if (!asksPresent()) audition("without"); break;
    case "KeyL": $("loop").click(); break;
    case "KeyG": $("slow").click(); break;
    case "KeyF": if (!asksPresent()) $("tool").click(); break;
    case "Escape": state.pending = null; state.selected = null; state.boost = null; renderSelection(); state.dirty = true; break;
    case "Delete": case "Backspace": removeSelected(); break;
    case "Enter": event.preventDefault(); if (field && field.blur) field.blur(); finishClip(); break;
    case "BracketLeft": nextClip(-1); break;
    case "BracketRight": nextClip(1); break;
    case "ArrowLeft": case "ArrowRight": {
      event.preventDefault();
      const at = Math.max(0, Math.min(state.manifest.duration, currentPosition() + (event.code === "ArrowLeft" ? -0.5 : 0.5)));
      if (state.playing) play(at); else state.position = at;
      state.dirty = true;
      break;
    }
    default: break;
  }
});
window.addEventListener("pointerdown", () => { if (audio.ctx) return; ensureAudio(); connectGains(); }, { once: true });

async function start() {
  await loadMessages();
  const response = await fetch("/api/round");
  const payload = await response.json();
  state.manifest = payload.manifest;
  state.labels = payload.labels || {};
  Object.values(state.labels).forEach(normalizeLabel);
  state.stem = state.manifest.default_stem || state.manifest.stems[1].id;
  $("title").textContent = t("roundTitle", { round: state.manifest.round });
  if (asksPresent()) {
    state.loop = true;
    $("loop").className = "on";
    $("tool").hidden = true;
    $("intro").innerHTML = t("introTicks");
    $("presentAsk").innerHTML = t("songAskTicks");
    $("hints").innerHTML = t("hintsTicks");
  }
  resetView();
  renderDelay();
  const first = state.manifest.clips.findIndex((c) => !(state.labels[c.id] && state.labels[c.id].done));
  await loadClip(first >= 0 ? first : 0);
  requestAnimationFrame(frame);
}
start().catch((error) => setStatus(messages ? t("loadFailed", { error: error.message }) : error.message, true));
</script>
</body>
</html>
