[project]
name = "musetric-lab"
version = "0.0.1"
requires-python = "==3.13.11"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "rotary-embedding-torch==0.8.9",
    "safetensors==0.7.0",
    "einops==0.8.2",
    "numpy==2.4.6",
    "numba==0.65.1",
    "PyYAML==6.0.3",
    "platformdirs==4.10.0",
    "whisperx==3.8.6",
    "hf-xet==1.5.1",
    "beat-this==1.1.0",
    "soundfile==0.14.0",
    "nnAudio==0.3.4",
    "librosa==0.11.0",
    "onnxruntime-gpu==1.30.0",
    "swift-f0==0.3.0",
    "torchcrepe==0.0.24",
    "torchfcpe==0.0.4",
    "madmom",
]

[project.scripts]
musetric-separate = "musetric_toolkit.separate_audio.main_cli:main_cli"
musetric-transcribe = "musetric_toolkit.transcribe_audio.main_cli:main_cli"
musetric-rhythm = "musetric_toolkit.rhythm_audio.main_cli:main_cli"
musetric-key = "musetric_toolkit.key_audio.main_cli:main_cli"
musetric-chords = "musetric_toolkit.chords_audio.main_cli:main_cli"
musetric-pitch = "musetric_toolkit.pitch_audio.main_cli:main_cli"
musetric-pitch-zoo = "musetric_toolkit.pitch_zoo.main_cli:main_cli"
musetric-parity = "musetric_toolkit.parity_audio.main_cli:main_cli"
musetric-rhythm-bench = "musetric_toolkit.rhythm_bench.main_cli:main_cli"

[tool.uv]
required-version = "==0.13.5"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
override-dependencies = ["onnxruntime; sys_platform == 'no-such-platform'"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
madmom = { git = "https://github.com/CPJKU/madmom", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }

[dependency-groups]
check = [
    "black==26.5.1",
    "isort==8.0.1",
    "ruff==0.15.17",
]
export = [
    "onnx==1.22.0",
    "onnxconverter-common==1.16.0",
    "onnxscript==0.7.1",
]
pitch-research = [
    "matplotlib==3.10.8",
    "penn==1.0.0",
    "pesto-pitch==2.0.1",
    "pyworld-prebuilt==0.3.6.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musetric_toolkit"]

[tool.black]
exclude = "(.venv|tmp/|musetric_toolkit/chords_audio/chordmini|musetric_toolkit/key_audio/skey|musetric_toolkit/pitch_audio/rmvpe|scripts/onnx/whisper/(convert|quantize)\\.py|scripts/onnx/whisper/extra)"

[tool.isort]
profile = "black"
skip_gitignore = true
skip = [
    ".venv",
    "musetric_toolkit/chords_audio/chordmini",
    "musetric_toolkit/key_audio/skey",
    "musetric_toolkit/pitch_audio/rmvpe",
    "scripts/onnx/whisper/extra",
]
skip_glob = [
    "*/onnx/whisper/convert.py",
    "*/onnx/whisper/quantize.py",
]

[tool.ruff]
exclude = [
    ".venv",
    "musetric_toolkit/chords_audio/chordmini",
    "musetric_toolkit/key_audio/skey",
    "musetric_toolkit/pitch_audio/rmvpe",
    "scripts/onnx/whisper/convert.py",
    "scripts/onnx/whisper/quantize.py",
    "scripts/onnx/whisper/extra",
]
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "C90",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TCH",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
